name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: swift
          build-mode: manual
      - name: Compile Swift for analysis
        run: |
          mkdir -p build
          swiftc -parse-as-library -swift-version 5 -Onone -warnings-as-errors \
            -module-cache-path "$RUNNER_TEMP/swift-module-cache" \
            -target "$(uname -m)-apple-macos14.0" Sources/*.swift -o build/Splinter
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:swift
