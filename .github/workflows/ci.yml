name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release versioning
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Test event engine
        run: python3 Tests/run-tests.py
      - name: Prepare version
        id: version
        run: python3 scripts/release.py prepare
      - name: Build universal app
        env:
          SPLINTER_VERSION: ${{ steps.version.outputs.version }}
          SPLINTER_BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: ./build.sh --adhoc --universal
      - name: Verify bundle and architectures
        run: |
          plutil -lint build/Splinter.app/Contents/Info.plist
          test -s build/Splinter.app/Contents/Resources/LICENSE.txt
          ARCHS="$(lipo -archs build/Splinter.app/Contents/MacOS/Splinter)"
          [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]]
          codesign --verify --deep --strict build/Splinter.app
      - name: Build CLI
        run: |
          ./cli/build.sh
          ./cli/mouse-remap --help
      - name: Package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Splinter.app "dist/Splinter-${RELEASE_VERSION}-universal.zip"
          cd dist
          shasum -a 256 "Splinter-${RELEASE_VERSION}-universal.zip" > SHA256SUMS
      - name: Upload release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-${{ github.sha }}
          path: dist/
      - name: Verify download checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish version and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
